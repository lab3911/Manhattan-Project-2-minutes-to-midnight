<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manhattan Project 2: Minutes to Midnight Soundboard</title>
  <style>
    body {
      background-color: #1e1e1e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
    }

    .soundboard {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .sound-button {
      background-color: #333;
      border: none;
      border-radius: 8px;
      padding: 1rem 2rem;
      font-size: 1rem;
      color: #f0f0f0;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .sound-button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>Manhattan Project Soundboard</h1>
  <div class="soundboard">
    <button class="sound-button" onclick="playSound('nuke_test_site')">Nuclear Test Site</button>
    <button class="sound-button" onclick="playSound('Nuke_3rd_World')">Third World Country Nuke</button>
    <button class="sound-button" onclick="playSound('Airstrike')">Fighter Pilots</button>
        <button class="sound-button" onclick="playSound('Air_defense')">Air Defense</button>
    <button class="sound-button" onclick="playSound('underwater_explosion')">Submarine Missiles</button>
    <button class="sound-button" onclick="playSound('Sub_Sweep')">Submarine Sweep</button>
  </div>

  <script>
    function playSound(soundId) {
      const audio = new Audio(`sounds/${soundId}.mp3`);
      audio.play();
    }
  </script>
</body>
</html>
