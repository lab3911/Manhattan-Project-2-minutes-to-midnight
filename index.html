<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manhattan Project Sounds</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #111;
            color: #eee;
        }
        h1 {
            color: #ffcc00;
        }
        button {
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #444;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <h1>Manhattan Project Sounds</h1>

    <p>Sub Sweep</p>
    <button onclick="document.getElementById('audio0').play()">Play</button>
    <audio id="audio0" src="Sub Sweep.mp3" preload="auto" controls></audio>
    
    <p>nuke test site</p>
    <button onclick="document.getElementById('audio1').play()">Play</button>
    <audio id="audio1" src="nuke test site.mp3" preload="auto" controls></audio>
    
    <p>underwater explosion</p>
    <button onclick="document.getElementById('audio2').play()">Play</button>
    <audio id="audio2" src="underwater explosion.mp3" preload="auto" controls></audio>
    
    <p>Air defense</p>
    <button onclick="document.getElementById('audio3').play()">Play</button>
    <audio id="audio3" src="Air defense.mp3" preload="auto" controls></audio>
    
    <p>Airstrike</p>
    <button onclick="document.getElementById('audio4').play()">Play</button>
    <audio id="audio4" src="Airstrike.mp3" preload="auto" controls></audio>
    
    <p>Nuke 3rd World</p>
    <button onclick="document.getElementById('audio5').play()">Play</button>
    <audio id="audio5" src="Nuke 3rd World.mp3" preload="auto" controls></audio>
    
</body>
</html>
